<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Complete · ComicCraftAI
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: grid;

            place-items: center;

            padding: 22px;

            font-family:
                Inter,
                Arial,
                sans-serif;

            background: #f4f2fb;

            color: #1c1730;
        }

        .card {
            width:
                min(
                    560px,
                    100%
                );

            padding: 38px;

            border-radius: 25px;

            text-align: center;

            background: white;

            box-shadow:
                0 18px 50px
                rgba(41,31,85,.12);
        }

        .icon {
            font-size: 3.5rem;
        }

        .button {
            display: inline-block;

            margin-top: 12px;

            padding: 12px 17px;

            border-radius: 12px;

            text-decoration: none;

            font-weight: 800;

            background: #1c1730;

            color: white;
        }

        .secondary {
            background: #eee;

            color: #1c1730;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        🎉
    </div>

    <h1>
        Your comic is ready!
    </h1>

    <p>
        The PDF export was created successfully.
    </p>


    {% if pdf_url %}

    <a
        class="button"
        href="{{ pdf_url }}"
        download
    >
        ⬇ Download PDF
    </a>

    {% endif %}


    <br>


    <a
        class="button secondary"
        href="/"
    >
        Create Another Comic
    </a>

</div>

</body>

</html>
